name: release

# Push a tag like v0.1.0 to publish Celare-0.1.0.zip (the app, CLI inside),
# celare-0.1.0-darwin.tar.gz (CLI only) and checksums.txt, then update the
# Homebrew formula in Mergemat/homebrew-tap. HOMEBREW_TAP_DEPLOY_KEY is the
# private half of a deploy key that can write to that one repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Celare-$v.zip" "dist/celare-$v-darwin.tar.gz" dist/checksums.txt \
            --title "celare $v" --generate-notes

      - name: Update the Homebrew formula
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        if: env.DEPLOY_KEY != ''
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "dist/Celare-$v.zip" | cut -d' ' -f1)
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Mergemat/homebrew-tap.git tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/g" packaging/homebrew/celare.rb > tap/Formula/celare.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/celare.rb
          git commit -m "celare $v"
          git push
