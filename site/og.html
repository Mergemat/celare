<!doctype html>
<!-- The social card. Render with `make og`; it writes og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(900px 640px at 930px 315px, #1B2C66 0%, #0E1530 62%);
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark { position: absolute; left: 570px; top: -45px; width: 720px; height: 720px; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; font-size: 84px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; }
  .cmd {
    margin-top: 44px; display: inline-flex; align-self: flex-start; align-items: center; gap: 14px;
    height: 58px; padding: 0 22px; border-radius: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 22px;
    background: linear-gradient(#406BDB, #17338C);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 1px rgba(0,0,0,.35), 0 18px 40px -16px rgba(0,0,0,.6);
  }
  .cmd .p { opacity: .55; }
  .site { position: absolute; left: 80px; bottom: 56px; font-size: 22px; color: #8B97BE; letter-spacing: -0.01em; }
</style>
</head>
<body>
<!-- The aperture mark, from Mark.swift's 24-unit square, with rings of the
     same opening spreading out from it. -->
<svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA2FF"/>
      <stop offset="1" stop-color="#2447B8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4D80F2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4D80F2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="7" fill="url(#glow)"/>
  <g fill="none" stroke="#8FB0FF" stroke-linecap="round" stroke-width=".09">
    <path opacity=".3" d="M17.82 16.89A7.6 7.6 0 1 1 17.82 7.11"/>
    <path opacity=".16" d="M19.81 18.56A10.2 10.2 0 1 1 19.81 5.44"/>
    <path opacity=".07" d="M21.81 20.23A12.8 12.8 0 1 1 21.81 3.77"/>
  </g>
  <g transform="translate(12 12) scale(.6) translate(-12 -12)">
    <path fill="none" stroke="url(#ring)" stroke-width="3.2" stroke-linecap="round" d="M18.51 17.46A8.5 8.5 0 1 1 18.51 6.54"/>
    <circle cx="12" cy="12" r="2.6" fill="#fff"/>
  </g>
</svg>

<div class="copy">
  <h1>A VPN your agents can drive.</h1>
  <div class="cmd"><span class="p">$</span>brew install --cask mergemat/tap/celare</div>
</div>
<div class="site">celare.omarov.sh</div>
</body>
</html>
